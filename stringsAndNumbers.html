<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Page</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <p id="outputText"></p>

    <script>
      function stringToNumber(text) {
        return parseInt(text);
      }

      var text1 = "10";
      var text2 = "2";

      var num1 = stringToNumber(text1);
      var num2 = stringToNumber(text2);

      if (isNaN(num1) || isNaN(num2)) {
        document.getElementById("outputText").innerHTML = "You have not entered a valid number. Please try again.";
      } else {
        document.getElementById("outputText").innerHTML = "The result is: " + (num1 / num2);
      }
    </script>
  </body>
</html>
